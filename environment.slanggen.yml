# Shared Windows/Linux NVIDIA environment for representational experiments,
# overlap analysis, and GPT/Hugging Face evaluation (HF backend).
# Gemma-4 judging uses the separate LLM_Eval/setup_gemma_judge_conda.sh environment.
name: slanggen
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10.19
  - pip
  - numpy=1.26.4
  - pandas=2.3.0
  - scipy=1.10.1
  - scikit-learn=1.7.0
  - nltk=3.9.1
  - gensim=4.3.2
  - jupyterlab=4.5.4
  - sentencepiece=0.2.0
  - tqdm=4.67.1
  - matplotlib=3.9.2
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.8.0+cu128
      - accelerate==1.12.0
      - beautifulsoup4==4.14.3
      - huggingface-hub==0.36.0
      - openai==3.24.0
      - protobuf==6.33.5
      - python-dotenv==1.2.4
      - requests==2.34.2
      - safetensors==0.5.3
      - sentence-transformers==2.6.1
      - tokenizers==0.22.1
      - transformers==4.57.3
